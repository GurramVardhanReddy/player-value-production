[project]
name = "player-value-production"
version = "0.1.0"
description = "The player value model in production: Airflow retraining and scoring, MLflow registry with a promotion gate, drift and performance monitoring, a FastAPI scoring service"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
pipeline = ["mlflow>=3.1,<4"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
snowflake = ["snowflake-connector-python>=3.12"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pvprod"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S301", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
